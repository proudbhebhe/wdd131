<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Alphatron logo</title>
  <desc id="desc">Alphatron angular A emblem surrounded by blue orbital arcs and connection nodes.</desc>

  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18B7FF"/>
      <stop offset="52%" stop-color="#087BFF"/>
      <stop offset="100%" stop-color="#174DE8"/>
    </linearGradient>
    <linearGradient id="aGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08245B"/>
      <stop offset="100%" stop-color="#061A45"/>
    </linearGradient>
  </defs>

  <!-- Upper orbital arc -->
  <path d="M 166 548
           C 92 395, 126 230, 252 137
           C 350 64, 474 43, 590 70
           C 704 97, 797 166, 846 262"
        fill="none"
        stroke="url(#blue)"
        stroke-width="34"
        stroke-linecap="butt"/>

  <!-- Right orbital segment -->
  <path d="M 874 385
           C 880 448, 867 508, 840 559"
        fill="none"
        stroke="url(#blue)"
        stroke-width="34"
        stroke-linecap="butt"/>

  <!-- Orbit node -->
  <circle cx="874" cy="322" r="44" fill="url(#blue)"/>

  <!-- Main A -->
  <path d="M 176 694
           L 421 178
           L 579 178
           L 824 694
           L 691 651
           L 500 315
           L 309 651
           Z"
        fill="url(#aGradient)"/>

  <!-- Inner blue triangle -->
  <path d="M 500 465 L 604 666 L 396 666 Z"
        fill="url(#blue)"/>

  <!-- Lower orbital/network arc -->
  <path d="M 112 761
           C 329 654, 671 654, 888 761"
        fill="none"
        stroke="url(#blue)"
        stroke-width="34"
        stroke-linecap="round"/>

  <!-- Lower connection nodes -->
  <circle cx="112" cy="761" r="43" fill="url(#blue)"/>
  <circle cx="888" cy="761" r="43" fill="url(#blue)"/>
</svg>
